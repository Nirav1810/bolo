# sherpa-onnx-sys downloads prebuilt libs without verifying them, and GitHub's direct
# release-download route is sometimes unavailable. scripts/fetch-sherpa-libs.py fetches
# the exact archive for this host, checks its SHA-256 and unpacks lib/ here (ADR-008).
# Outside target/ so CI caches can't restore a build-script result without its libs.
[env]
SHERPA_ONNX_LIB_DIR = { value = ".cache/sherpa-lib", relative = true }

# Link the MSVC C runtime statically, so `bolo.exe` runs on a clean Windows install that
# has no Visual C++ Redistributable (the release zip ships no VCRUNTIME140.dll). The
# sherpa-onnx libs above are the matching static-CRT ("MT") build.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
