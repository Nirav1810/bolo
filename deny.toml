[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0", "bzip2-1.0.6",
  # permissive, MIT/Apache-compatible
  "BSL-1.0", "CC0-1.0", "MIT-0",
]

[bans]
multiple-versions = "warn"
# OpenSSL must never enter the tree (ADR-004).
deny = [{ name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
