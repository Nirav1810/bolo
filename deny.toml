[graph]
all-features = false

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates that Tauri 2 pulls in for the desktop app (M3
# ticket 01). No Tauri 2 release avoids them; revisit when Tauri updates these deps.
ignore = [
  # Linux only, never shipped (the desktop app is Windows-only): the GTK stack under
  # tray-icon/muda/wry (glib-macros -> proc-macro-error) and D-Bus under
  # tauri-plugin-single-instance (zbus -> zvariant, zbus_names).
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro in the Linux GTK stack; not in the Windows app" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux D-Bus (single-instance); not in the Windows app" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux D-Bus (single-instance); not in the Windows app" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux D-Bus (single-instance); not in the Windows app" },
  # tauri-utils -> urlpattern -> unic-*: Unicode identifier tables used by tauri-build and
  # Tauri's URL patterns. Static data, no unsafe input handling of note.
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils/urlpattern; no maintained Tauri 2 alternative" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils/urlpattern; no maintained Tauri 2 alternative" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils/urlpattern; no maintained Tauri 2 alternative" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils/urlpattern; no maintained Tauri 2 alternative" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils/urlpattern; no maintained Tauri 2 alternative" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0", "bzip2-1.0.6",
  # permissive, MIT/Apache-compatible
  "BSL-1.0", "CC0-1.0", "MIT-0",
]

[bans]
multiple-versions = "warn"
# OpenSSL must never enter the tree (ADR-004).
deny = [{ name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
