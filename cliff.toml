# git-cliff config for CHANGELOG.md (ADR-0013). `scripts/release.py` runs it; don't edit
# CHANGELOG.md by hand, since every release PR regenerates it from history.
#
# Every commit on `main` is a squash-merged PR whose title passed scripts/pr_title.py, so
# commits are grouped by their Conventional Commit type.

[changelog]
header = """
# Changelog

All notable changes to Bolo. Generated by [git-cliff](https://git-cliff.org) from the \
Conventional Commit titles on `main`; versions follow [ADR-0013](docs/adr/0013-single-version-trunk-releases.md).
"""
# `scripts/release.py notes` cuts a version's section out of this file at each `## [`
# heading, so keep that heading shape.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
# `trim` also eats the blank line before each `## [` heading; release.py puts it back.

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Squash titles end in `(#N)`; link those to the PR.
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/Nirav1810/bolo/pull/${1}))" },
]
# The `<!-- N -->` prefixes fix the section order; the template strips them.
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = "<!-- 0 -->Features" },
  { message = '^fix', group = "<!-- 1 -->Bug fixes" },
  { message = '^perf', group = "<!-- 2 -->Performance" },
  { message = '^revert', group = "<!-- 3 -->Reverts" },
  { message = '^refactor', group = "<!-- 4 -->Refactoring" },
  { message = '^docs', group = "<!-- 5 -->Documentation" },
  { message = '^test', group = "<!-- 6 -->Tests" },
  { message = '^(ci|build)', group = "<!-- 7 -->Build and CI" },
  { message = '^chore', group = "<!-- 8 -->Chores" },
]
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-beta\\.[0-9]+)?$"
topo_order = false
sort_commits = "oldest"
