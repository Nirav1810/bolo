[package]
name = "bolo"
description = "Bolo from the terminal: dictate, replay clips through the engine, and benchmark STT engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bolo"
path = "src/main.rs"

[dependencies]
bolo-audio = { workspace = true, features = ["capture"] }
bolo-core = { workspace = true }
bolo-stt = { workspace = true }
bolo-models = { workspace = true }
bolo-format = { workspace = true, features = ["llm"] }
anyhow = { workspace = true }
# loads keys from the git-ignored .env (dev convenience; apps use the OS keychain)
dotenvy = "0.15"
# clipboard for `dictate` (CLI only; the apps use native clipboard APIs)
arboard = { version = "3.7", default-features = false }
clap = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sysinfo = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs"] }
