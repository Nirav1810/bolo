[package]
name = "bolo-ffi"
description = "UniFFI bindings to Kotlin for the Android app (ADR-0023)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
name = "bolo_ffi"

# Generates the Kotlin bindings from the built library:
# `cargo run -p bolo-ffi --features bindgen --bin uniffi-bindgen -- generate --library <.so> --language kotlin --out-dir <dir>`
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
bolo-core = { workspace = true }
bolo-models = { workspace = true }
bolo-store = { workspace = true }
bolo-stt = { workspace = true }
keyring-core = "1"
# Runtimes for model downloads (`models::run`) and probe_https (the engine runs its own).
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
uniffi = "0.33"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
# Native.initTls: the verifier's Android init takes a JNIEnv (UniFFI's JNA has none).
jni = "0.22"
rustls-platform-verifier = { workspace = true }

# `statvfs` for the free-space check before a model download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
toml = { workspace = true }
