[package]
name = "bolo-core"
description = "Bolo dictation state machine and pipeline orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["capture"]
# The live microphone through cpal (`MicSource`, `Engine::new`). Off on Android, where
# Kotlin records and pushes frames into an `AudioSource` (ADR-0023).
capture = ["bolo-audio/capture"]

[dependencies]
bolo-audio = { workspace = true }
bolo-stt = { workspace = true }
bolo-models = { workspace = true }
bolo-format = { workspace = true, features = ["llm"] }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
