# Whole-pipeline cases: several passes on one dictation. Passes added later (fillers,
# corrections, numbers, lists) add their combined cases here.

[[case]]
note = "a short message with commands, i and loose punctuation"
input = "hi team , new line i will be late today new paragraph thanks"
expected = "Hi team\nI will be late today\n\nThanks."

[[case]]
note = "a Hinglish message with a command"
language = "hinglish"
input = "kal meeting hai na , nayi line agenda bhej dena please"
expected = "Kal meeting hai na\nAgenda bhej dena please."

[[case]]
note = "already-finished engine output passes through unchanged"
input = "Can you send me the report by Friday? I need it for the review."
expected = "Can you send me the report by Friday? I need it for the review."

[[case]]
note = "fillers, a stutter and a correction in one unpunctuated dictation"
input = "um so i i think we should meet on tuesday actually no make it friday new line thanks"
expected = "So I think we should meet on friday\nThanks."

[[case]]
note = "a Hinglish dictation with a start filler and a correction"
language = "hinglish"
input = "matlab kal shaam ko chalte hain nahi wait parson chalte hain"
expected = "Parson chalte hain."
