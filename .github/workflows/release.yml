name: release

# Pushing a `vX.Y.Z` or `vX.Y.Z-beta.N` tag (made by `scripts/release.py tag`, ADR-0013)
# builds the Windows x64 `bolo` CLI zip and the desktop app's NSIS installer, and
# publishes the GitHub Release. Notes come from
# the tagged CHANGELOG.md; only old-style `-beta.` tags are prereleases (ADR-0019).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the zip
      actions: read # SignPath reads this run's details and the unsigned artifact
    # Authenticode signing through SignPath (ADR-0021, docs/SIGNING.md) runs only once the
    # SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable are set. Until
    # then the signing steps are skipped and the installer ships unsigned, as before.
    env:
      SIGNPATH_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches the manifests and is on main
        run: python -I scripts/release.py check --tag "$GITHUB_REF_NAME" --on-main
      - uses: dtolnay/rust-toolchain@stable
      # No build cache: release binaries are built from scratch.
      - name: "Fetch verified sherpa-onnx prebuilt libs (ADR-008)"
        run: python -I scripts/fetch-sherpa-libs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # .cargo/config.toml links the C runtime statically, so the zip needs no VC++ redist.
      - run: cargo build --release --locked -p bolo
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # Per-user NSIS installer with the sherpa-onnx DLLs next to the exe; no model.
      # Signs the installer for the updater (ADR-0019): writes Bolo_X_x64-setup.exe.sig.
      - name: Build the desktop installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Zip bolo.exe with the sherpa-onnx DLLs, README and licences; collect the installer
        run: python -I scripts/release.py package "$GITHUB_REF_NAME"
      # Signing (ADR-0021): SignPath takes the installer as a workflow artifact and hands
      # back the signed copy, which replaces dist/'s. The updater .sig that `tauri build`
      # wrote covers the unsigned bytes, so it and the .sha256 are redone over the signed file.
      - name: Pick the version to sign
        id: tag
        if: env.SIGNPATH_SIGNING == 'true'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: env.SIGNPATH_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/Bolo_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer with SignPath (release-signing, waits for approval)
        if: env.SIGNPATH_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: bolo
          signing-policy-slug: release-signing
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # Metadata restrictions in .signpath/artifact-configurations/default.xml.
          parameters: |
            productName: "Bolo"
            version: "${{ steps.tag.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Check the signed installer's Authenticode signature
        if: env.SIGNPATH_SIGNING == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature (Get-Item signed\Bolo_*_x64-setup.exe).FullName
          Write-Output "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "the signed installer's signature is $($sig.Status): $($sig.StatusMessage)" }
      - name: Use the signed installer; redo its updater signature and checksum
        if: env.SIGNPATH_SIGNING == 'true'
        run: |
          setup=$(basename signed/Bolo_*_x64-setup.exe)
          cp "signed/$setup" "dist/$setup"
          (cd apps/desktop && npx tauri signer sign --app-version "$VERSION" "../../dist/$setup")
          python -I scripts/release.py sha256 "dist/$setup"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Unzip into an empty folder and run it with only Windows' own folders on PATH, so a
      # DLL that only the build machine has fails here instead of on a user's machine.
      - name: Smoke-test the zip in isolation
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP smoke
          Expand-Archive (Get-Item dist\*.zip).FullName $dir
          $exe = (Get-ChildItem $dir -Recurse -Filter bolo.exe).FullName
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "bolo --help exited $LASTEXITCODE" }
          $version = & $exe --version
          if ($version -ne "bolo $($env:GITHUB_REF_NAME.Substring(1))") { throw "unexpected version: $version" }
          Write-Output "ok: $version"
      # Install silently into a fresh folder, check the app and its DLLs landed, uninstall.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $setup = (Get-Item dist\Bolo_*_x64-setup.exe).FullName
          Write-Output ("installer: {0:N1} MB" -f ((Get-Item $setup).Length / 1MB))
          $dir = Join-Path $env:RUNNER_TEMP bolo-install
          Start-Process $setup -ArgumentList "/S", "/D=$dir" -Wait
          foreach ($f in "bolo-desktop.exe", "onnxruntime.dll", "sherpa-onnx-c-api.dll", "uninstall.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-ChildItem $dir; throw "the installer left out $f" }
          }
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          if (Test-Path (Join-Path $dir "bolo-desktop.exe")) { throw "the uninstaller left bolo-desktop.exe" }
          Write-Output "ok: installed and uninstalled"
      # The Beta feed: /releases/latest/download/latest.json (ADR-0019).
      - name: Write the updater feed
        run: python -I scripts/release.py feed "$GITHUB_REF_NAME" --url-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
      - name: Publish the GitHub Release
        run: python -I scripts/release.py publish "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/*-setup.exe dist/*-setup.exe.sha256 dist/*-setup.exe.sig dist/latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
