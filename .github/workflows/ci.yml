name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the release dry run renders the changelog from them.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (cpal microphone capture)
        if: runner.os == 'Linux'
        shell: bash
        # On 2026-11-11 the runners stopped resolving *.ubuntu.com for hours, so this
        # retries with timeouts and then falls back to Ubuntu mirrors hosted elsewhere.
        run: |
          pkgs="libasound2-dev pkg-config"
          if dpkg -s $pkgs >/dev/null 2>&1; then echo "Already installed."; exit 0; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          try_install() {
            sudo apt-get $apt_opts update || true
            sudo apt-get $apt_opts install -y --no-install-recommends $pkgs
          }
          try_install && exit 0
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu https://ftp.uni-stuttgart.de/ubuntu; do
            echo "::warning::Ubuntu's own mirrors failed; trying $mirror"
            sudo mkdir -p /etc/apt/sources-off
            sudo sh -c 'mv /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/sources-off/ 2>/dev/null; : > /etc/apt/sources.list'
            printf 'Types: deb\nURIs: %s\nSuites: %s %s-updates %s-security\nComponents: main universe\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' \
              "$mirror" "$codename" "$codename" "$codename" | sudo tee /etc/apt/sources.list.d/fallback.sources
            try_install && exit 0
          done
          exit 1
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      # Includes the release script's dry run (files it would change, versions consistent).
      - name: Test repo scripts (PR-title lint, workspace manifests, release script)
        run: python -I -m unittest discover -s scripts -v
      - name: Version strings agree across manifests
        run: python -I scripts/release.py check
      - name: Release dry run (ADR-0013)
        if: runner.os == 'Linux'
        run: python -I scripts/release.py 99.0.0-beta.1 --dry-run
      - name: "Fetch verified sherpa-onnx prebuilt libs (ADR-008: verify, unpack outside target/)"
        run: python -I scripts/fetch-sherpa-libs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # sherpa-onnx-sys copies its shared libs into target/<profile> only when its build
      # script runs, and rust-cache restores target/ without them. Point the loader at the
      # verified libs directly so test binaries that link sherpa (bolo-core tests) start.
      - name: Put sherpa-onnx shared libs on the runtime library path
        shell: bash
        run: |
          lib="$GITHUB_WORKSPACE/.cache/sherpa-lib"
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$lib" >> "$GITHUB_PATH"
          else
            echo "LD_LIBRARY_PATH=$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
      - run: cargo fmt --all --check
      # The desktop app needs its frontend built first; the desktop job checks it.
      - run: cargo clippy --workspace --exclude bolo-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude bolo-desktop

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The Windows desktop app (apps/desktop): frontend, then the Tauri crate. Required check.
  desktop:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend install, type check and build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run build
      - name: "Fetch verified sherpa-onnx prebuilt libs (ADR-008)"
        run: python -I scripts/fetch-sherpa-libs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Put sherpa-onnx shared libs on the runtime library path
        shell: bash
        run: cygpath -w "$GITHUB_WORKSPACE/.cache/sherpa-lib" >> "$GITHUB_PATH"
      - run: cargo clippy -p bolo-desktop --all-targets -- -D warnings
      - run: cargo test -p bolo-desktop

  # The Android (cargo-ndk + Gradle) job is added in M5.
