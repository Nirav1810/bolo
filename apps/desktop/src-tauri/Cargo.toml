[package]
name = "bolo-desktop"
description = "Bolo for Windows: hold a key, speak, and the text lands in the app you're in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bolo_desktop"
path = "src/lib.rs"

[[bin]]
name = "bolo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bolo-audio = { workspace = true }
bolo-core = { workspace = true }
bolo-models = { workspace = true }
bolo-store = { workspace = true }
bolo-stt = { workspace = true }
bolo-format = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
sysinfo = { workspace = true }
toml = { workspace = true }
unicode-segmentation = "1.13"
# No `zip`: the feed serves the signed NSIS .exe itself, never a zipped legacy bundle.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"

[features]
# `BOLO_MEASURE=1` runs a build with this feature beside an installed Bolo, touching
# none of its state, so `scripts/idle_ram.ps1` can measure it (BENCH.md §21). Never on
# in shipped builds.
measure = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
